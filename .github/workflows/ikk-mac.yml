name: Ikk MacOS.

on:
  push:
    branches:
      - ikk-next
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/ikk-mac.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.bat'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/ikk-mac.yml'
      - 'lib/xdg/**'
      - 'snap/**'
      - 'Telegram/build/docker/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/linux/**'
      - 'Telegram/configure.bat'

  workflow_call:
    inputs:
      config:
        type: string
        default: Debug
      ref:
        type: string
        default: ""

jobs:

  macos:
    # A push whose commit message has a marker such as [macos-only] builds
    # only the named platforms; several markers may be combined.
    if: >-
      inputs.config == 'Release'
      || github.event_name != 'push'
      || !contains(github.event.head_commit.message, '-only]')
      || contains(github.event.head_commit.message, '[macos-only]')
    name: MacOS
    runs-on: macos-26

    # Dropping superseded caches needs to delete them.
    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        defines:
          - ""
    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      CONFIG: ${{ inputs.config || 'Debug' }}

    steps:
      - name: Get repository name.
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          path: ${{ env.REPO_NAME }}
          ref: ${{ inputs.ref }}

      - name: First set up.
        run: |
          sudo chown -R `whoami`:admin /usr/local/share

          retry="$REPO_NAME/tools/ikk/retry.sh"
          "$retry" 3 30 brew update
          brew upgrade || true
          "$retry" 3 30 brew install automake libtool meson nasm ninja pkg-config

          # Disable spotlight.
          sudo mdutil -a -i off

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          sudo sed -i '' '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/ -g//' /opt/homebrew/share/cmake/Modules/Compiler/GNU.cmake

      # Debug and Release share one copy of the libraries, built with their
      # release variants: a release cache saved from a tag run is visible only
      # to that tag, and a second copy does not fit the repository quota.
      # The key names the repository because the libraries record their
      # absolute paths: after a rename every one of them is rebuilt, and a hit
      # on the old key would keep that rebuild from being saved.
      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-v2-${{ env.REPO_NAME }}-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
          restore-keys: ${{ runner.OS }}-libs-v2-${{ env.REPO_NAME }}-

      - name: Libraries.
        run: |
          ./$REPO_NAME/Telegram/build/prepare/mac.sh silent

      # Old caches would push the libraries out of the repository quota.
      - name: Drop superseded caches.
        if: github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LIBS_KEY: ${{ runner.OS }}-libs-v2-${{ env.REPO_NAME }}-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}
        run: |
          bash "$REPO_NAME/tools/ikk/drop_superseded_caches.sh" "$LIBS_KEY"

      - name: Free up some disk space.
        run: find Libraries '(' '(' ! '(' -name '*.a' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -perm +111 ')' -type f ')' -o -empty ')' -delete

      # The combined cache step saves only when the whole job succeeds, which
      # would lose hours of libraries to a later failure.
      - name: Save Libraries cache.
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Libraries
            ThirdParty
          key: ${{ runner.OS }}-libs-v2-${{ env.REPO_NAME }}-${{ hashFiles(format('{0}/{1}', env.REPO_NAME, env.PREPARE_PATH)) }}

      - name: Ikk build.
        if: env.ONLY_CACHE == 'false'
        env:
          IKK_API_ID: ${{ secrets.IKK_API_ID }}
          IKK_API_HASH: ${{ secrets.IKK_API_HASH }}
        run: |
          cd $REPO_NAME/Telegram

          # Without the repository secrets, build with the test-only credentials.
          API=""
          if [ -z "$IKK_API_ID" ]; then
            API="-D TDESKTOP_API_TEST=ON"
          fi

          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
            echo "ARTIFACT_NAME=Ikk ${{ matrix.defines }}" >> $GITHUB_ENV
          else
            echo "ARTIFACT_NAME=Ikk" >> $GITHUB_ENV
          fi

          ./configure.sh \
          -D CMAKE_CONFIGURATION_TYPES=$CONFIG \
          -D DESKTOP_APP_TEST_APPS=ON \
          -D CMAKE_COMPILE_WARNING_AS_ERROR=${{ env.CONFIG == 'Debug' && 'ON' || 'OFF' }} \
          -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=${{ env.CONFIG == 'Release' && 'OFF' || 'ON' }} \
          $API \
          $DEFINE

          cmake --build ../out --config $CONFIG --parallel
          ../out/ikk-tests/$CONFIG/test_ikk

      - name: Smoke test.
        if: env.ONLY_CACHE == 'false'
        run: |
          python3 "$REPO_NAME/tools/ikk/smoke_test.py" \
            "$REPO_NAME/out/$CONFIG/Ikk.app/Contents/MacOS/Ikk"

      - name: Sign and notarize.
        if: env.ONLY_CACHE == 'false' && env.CONFIG == 'Release'
        env:
          IKK_MACOS_CERTIFICATE: ${{ secrets.IKK_MACOS_CERTIFICATE }}
          IKK_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.IKK_MACOS_CERTIFICATE_PASSWORD }}
          IKK_NOTARY_KEY: ${{ secrets.IKK_NOTARY_KEY }}
          IKK_NOTARY_KEY_ID: ${{ secrets.IKK_NOTARY_KEY_ID }}
          IKK_NOTARY_ISSUER_ID: ${{ secrets.IKK_NOTARY_ISSUER_ID }}
          IKK_NOTARY_APPLE_ID: ${{ secrets.IKK_NOTARY_APPLE_ID }}
          IKK_NOTARY_PASSWORD: ${{ secrets.IKK_NOTARY_PASSWORD }}
          IKK_NOTARY_TEAM_ID: ${{ secrets.IKK_NOTARY_TEAM_ID }}
        run: |
          # Signing seals the binaries, so the symbols go first.
          strip "$REPO_NAME/out/$CONFIG/Ikk.app/Contents/MacOS/Ikk"
          strip "$REPO_NAME/out/$CONFIG/Ikk.app/Contents/Frameworks/Updater"

          bash "$REPO_NAME/tools/ikk/sign_macos.sh" \
            "$REPO_NAME/out/$CONFIG/Ikk.app" \
            "$REPO_NAME/Telegram/Telegram/Telegram.entitlements"

          # The hardened runtime must not keep the signed app from starting.
          python3 "$REPO_NAME/tools/ikk/smoke_test.py" \
            "$REPO_NAME/out/$CONFIG/Ikk.app/Contents/MacOS/Ikk"

          # The disk image takes the signed app and is then signed itself.
          # Creating an image fails now and then with 'Resource busy'.
          python3 -m venv "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/dmg/bin/python" -m pip install --quiet --require-hashes \
            -r "$REPO_NAME/tools/ikk/macos_dmg.txt"
          bash "$REPO_NAME/tools/ikk/retry.sh" 3 10 \
            "$RUNNER_TEMP/dmg/bin/python" "$REPO_NAME/tools/ikk/macos_dmg.py" \
            --app "$REPO_NAME/out/$CONFIG/Ikk.app" \
            --out "$REPO_NAME/out/$CONFIG/Ikk-macos.dmg"
          bash "$REPO_NAME/tools/ikk/sign_macos.sh" \
            "$REPO_NAME/out/$CONFIG/Ikk-macos.dmg"

      - name: Move artifact.
        if: env.UPLOAD_ARTIFACT == 'true'
        env:
          IKK_UPDATE_KEY: ${{ secrets.IKK_UPDATE_KEY }}
        run: |
          cd $REPO_NAME/out/$CONFIG
          mkdir artifact
          if [ "$CONFIG" = "Release" ]; then
            ditto -c -k --keepParent Ikk.app artifact/Ikk-macos.zip
            mv Ikk-macos.dmg artifact/
            if [ -n "$IKK_UPDATE_KEY" ]; then
              # A universal bundle goes into the package of each architecture
              # as it is: thinning it would break the signature.
              for arch in $(lipo -archs Ikk.app/Contents/MacOS/Ikk); do
                python3 ../../tools/ikk/pack_update.py --packer Packer --out artifact \
                  --app Ikk.app --arch "$arch"
              done
            else
              echo "::warning::IKK_UPDATE_KEY is not set: no update package, this build is not offered to installed copies."
            fi
            echo "ARTIFACT_NAME=release-macos" >> $GITHUB_ENV
          else
            mv Ikk.app artifact/
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload artifact.
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.REPO_NAME }}/out/${{ env.CONFIG }}/artifact/
          retention-days: 1
